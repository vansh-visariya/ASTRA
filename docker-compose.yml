version: '3.8'

services:
  # ===========================================================================
  # Federated Learning API Server
  # ===========================================================================
  fl_server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: fl_server
    ports:
      - "8000:8000"
    environment:
      - ENV=${ENV:-dev}
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production-use-32-chars}
    volumes:
      - ./data:/data
      - ./models:/models
    networks:
      - fl_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # Dashboard (Next.js Frontend)
  # ===========================================================================
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: fl_dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://fl_server:8000
      - NEXT_PUBLIC_WS_URL=ws://fl_server:8000
    depends_on:
      - fl_server
    networks:
      - fl_network
    restart: unless-stopped

  # ===========================================================================
  # Client (multi-PC / CI deployment template)
  # ===========================================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    container_name: fl_client
    environment:
      - SERVER_URL=http://fl_server:8000
    networks:
      - fl_network
    restart: on-failure

  # ===========================================================================
  # Optional: Redis for caching (profile: production)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: fl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fl_network
    profiles:
      - production

networks:
  fl_network:
    driver: bridge

volumes:
  redis_data:
